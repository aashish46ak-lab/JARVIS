<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JARVIS Phone</title>
  <style>
    :root { --bg:#05070c; --gold:#ff9a1f; --gold2:#ffd27a; --text:#eef3ff; --muted:#7a8799; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background: radial-gradient(ellipse at top, #1a1208 0%, var(--bg) 55%); color: var(--text); min-height: 100dvh; display:flex; flex-direction:column; }
    header { padding: 1rem 1.1rem 0.6rem; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; letter-spacing:0.28em; font-size:0.95rem; background: linear-gradient(90deg, #fff, var(--gold2), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .chip { font-size:0.65rem; border:1px solid rgba(255,154,31,0.35); color:var(--gold2); padding:0.2rem 0.5rem; border-radius:999px; }
    #pair { padding: 1.2rem; }
    #pair input { width:100%; padding:0.85rem; border-radius:12px; border:1px solid rgba(255,154,31,0.35); background:#0a0f18; color:#fff; font-size:1.1rem; text-align:center; letter-spacing:0.3em; }
    #pair button, #send { width:100%; margin-top:0.75rem; padding:0.9rem; border:none; border-radius:12px; background: linear-gradient(90deg,#c45a00,#ff9a1f); color:#120800; font-weight:800; font-size:1rem; }
    #chat { flex:1; overflow-y:auto; padding:0.8rem 1rem 1rem; display:flex; flex-direction:column; gap:0.55rem; }
    .bubble { max-width:88%; padding:0.7rem 0.9rem; border-radius:14px; font-size:0.95rem; line-height:1.35; }
    .me { align-self:flex-end; background:rgba(255,154,31,0.18); border:1px solid rgba(255,154,31,0.3); }
    .bot { align-self:flex-start; background:rgba(20,28,40,0.9); border:1px solid rgba(255,255,255,0.08); }
    .sys { align-self:center; color:var(--muted); font-size:0.75rem; }
    footer { padding:0.75rem 1rem 1.1rem; border-top:1px solid rgba(255,154,31,0.15); background:rgba(0,0,0,0.25); }
    #msg { width:100%; padding:0.85rem; border-radius:12px; border:1px solid rgba(255,154,31,0.3); background:#0a0f18; color:#fff; font-size:1rem; }
    .hidden { display:none !important; }
    .hint { color:var(--muted); font-size:0.8rem; margin:0.5rem 0 0; line-height:1.4; }
  </style>
</head>
<body>
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div id="status" class="chip">PAIR</div>
  </header>
  <section id="pair">
    <p class="hint">Same Wi‑Fi as your PC. Enter the PIN from JARVIS Settings → Phone bridge.</p>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN" />
    <button id="pairBtn">Connect to PC</button>
    <p id="pairErr" class="hint"></p>
  </section>
  <section id="chat" class="hidden"></section>
  <footer id="composer" class="hidden">
    <input id="msg" placeholder="Command JARVIS…" />
    <button id="send">Send</button>
  </footer>
  <script>
    const chat = document.getElementById('chat');
    const status = document.getElementById('status');
    let token = localStorage.getItem('jarvis_token') || '';
    function bubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'bubble ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    async function pair() {
      const pin = document.getElementById('pin').value.trim();
      document.getElementById('pairErr').textContent = '';
      try {
        const res = await fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Pair failed');
        token = data.token;
        localStorage.setItem('jarvis_token', token);
        enterChat();
      } catch (e) {
        document.getElementById('pairErr').textContent = e.message || String(e);
      }
    }
    function enterChat() {
      document.getElementById('pair').classList.add('hidden');
      chat.classList.remove('hidden');
      document.getElementById('composer').classList.remove('hidden');
      status.textContent = 'LIVE';
      bubble('Linked to your PC. Send commands: open apps, system status, lock PC…', 'sys');
    }
    async function send() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      bubble(text, 'me');
      status.textContent = '…';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Jarvis-Token': token },
          body: JSON.stringify({ text, token }),
        });
        const data = await res.json();
        if (!data.ok) {
          if (res.status === 401) { localStorage.removeItem('jarvis_token'); token = ''; location.reload(); return; }
          throw new Error(data.error || 'Failed');
        }
        if (data.token) { token = data.token; localStorage.setItem('jarvis_token', token); }
        bubble(data.reply || 'Done.', 'bot');
        status.textContent = 'LIVE';
      } catch (e) {
        bubble(String(e.message || e), 'bot');
        status.textContent = 'ERR';
      }
    }
    document.getElementById('pairBtn').onclick = pair;
    document.getElementById('send').onclick = send;
    document.getElementById('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    if (token) enterChat();
  </script>
</body>
</html>
