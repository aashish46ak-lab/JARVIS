<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<style>
  :root{
    --cyan: #6fe3ff;
    --cyan-dim: #2a7f96;
    --cyan-bright: #baf3ff;
    --amber: #ffb92e;
    --bg: #050c10;
    --bg2: #08161c;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    height:100%;
    background: radial-gradient(circle at 50% 45%, var(--bg2) 0%, var(--bg) 65%, #020608 100%);
    overflow:hidden;
    font-family: 'Segoe UI', Consolas, monospace;
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(111,227,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(111,227,255,0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }
  .hud{
    position:relative;
    width: min(70vmin, 560px);
    height: min(70vmin, 560px);
  }
  svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow: visible;
  }
  .ring-outer{ animation: spin 40s linear infinite; }
  .ring-mid{ animation: spin-rev 26s linear infinite; }
  .ring-ticks{ animation: spin 90s linear infinite; }
  .ring-amber{ animation: spin 14s linear infinite; }
  .core-arcs{ animation: spin-rev 60s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes spin-rev{ to{ transform: rotate(-360deg); } }
  .glow-line{
    stroke: var(--cyan);
    filter: drop-shadow(0 0 3px rgba(111,227,255,0.9)) drop-shadow(0 0 8px rgba(111,227,255,0.5));
  }
  .glow-line-dim{ stroke: var(--cyan-dim); }
  .amber-line{
    stroke: var(--amber);
    filter: drop-shadow(0 0 4px rgba(255,185,46,0.9)) drop-shadow(0 0 10px rgba(255,185,46,0.5));
  }
  .label{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    letter-spacing: 6px;
    color: var(--cyan-bright);
    font-size: clamp(20px, 3.4vmin, 34px);
    font-weight: 600;
    text-shadow:
      0 0 6px rgba(186,243,255,0.9),
      0 0 18px rgba(111,227,255,0.6),
      0 0 40px rgba(111,227,255,0.35);
  }
  .label small{
    display:block;
    margin-top:8px;
    font-size: 0.32em;
    letter-spacing: 3px;
    color: var(--cyan);
    opacity:0.7;
    font-weight: 400;
  }
  .pulse-dot{ animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:0.3; }
    50%{ opacity:1; }
  }
  .flicker{ animation: flicker 3.6s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    50%{ opacity:0.85; }
    52%{ opacity:1; }
    54%{ opacity:0.6; }
    56%{ opacity:1; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="hud flicker">
    <svg class="ring-outer" viewBox="-100 -100 200 200">
      <circle class="glow-line-dim" cx="0" cy="0" r="96" fill="none" stroke-width="0.6" stroke-dasharray="1.2 3.4" opacity="0.6"/>
      <circle class="glow-line-dim" cx="0" cy="0" r="90" fill="none" stroke-width="1" opacity="0.4"/>
    </svg>
    <svg class="ring-ticks" viewBox="-100 -100 200 200">
      <g id="ticks"></g>
    </svg>
    <svg class="ring-mid" viewBox="-100 -100 200 200">
      <circle class="glow-line" cx="0" cy="0" r="78" fill="none" stroke-width="2.4" stroke-dasharray="140 400" stroke-linecap="round"/>
      <circle class="glow-line-dim" cx="0" cy="0" r="78" fill="none" stroke-width="1" opacity="0.35"/>
      <g id="notches"></g>
    </svg>
    <svg class="ring-amber" viewBox="-100 -100 200 200">
      <circle class="amber-line" cx="0" cy="0" r="66" fill="none" stroke-width="4"
        stroke-dasharray="95 400" stroke-linecap="round" transform="rotate(140)"/>
    </svg>
    <svg class="core-arcs" viewBox="-100 -100 200 200">
      <circle class="glow-line-dim" cx="0" cy="0" r="50" fill="none" stroke-width="0.6" stroke-dasharray="0.8 2.6" opacity="0.5"/>
      <circle class="glow-line" cx="0" cy="0" r="44" fill="none" stroke-width="1.4" stroke-dasharray="30 20 8 20" opacity="0.7"/>
      <g id="dots"></g>
    </svg>
    <svg viewBox="-100 -100 200 200">
      <circle class="glow-line-dim" cx="0" cy="0" r="38" fill="none" stroke-width="0.6" opacity="0.4"/>
    </svg>
    <div class="label">J.A.R.V.I.S.<small>SYSTEM ONLINE</small></div>
  </div>
</div>
<script>
  const ticks = document.getElementById('ticks');
  const N = 60;
  for(let i=0;i<N;i++){
    const angle = (i / N) * 360;
    const isMajor = i % 5 === 0;
    const r1 = 100;
    const r2 = isMajor ? 92 : 96;
    const rad = angle * Math.PI/180;
    const x1 = r1*Math.cos(rad), y1 = r1*Math.sin(rad);
    const x2 = r2*Math.cos(rad), y2 = r2*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke', isMajor ? '#6fe3ff' : '#2a7f96');
    line.setAttribute('stroke-width', isMajor ? 1.4 : 0.7);
    line.setAttribute('opacity', isMajor ? 0.85 : 0.4);
    ticks.appendChild(line);
  }
  const notches = document.getElementById('notches');
  for(let i=0;i<24;i++){
    const angle = (i/24)*360;
    const rad = angle*Math.PI/180;
    const r1=74, r2=82;
    const x1=r1*Math.cos(rad), y1=r1*Math.sin(rad);
    const x2=r2*Math.cos(rad), y2=r2*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke','#6fe3ff');
    line.setAttribute('stroke-width',0.8);
    line.setAttribute('opacity',0.3);
    notches.appendChild(line);
  }
  const dots = document.getElementById('dots');
  [0, 15, 30, 45, 60].forEach((a,i)=>{
    const rad = (140+a)*Math.PI/180;
    const r=44;
    const cx=r*Math.cos(rad), cy=r*Math.sin(rad);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',1.8);
    c.setAttribute('fill', i===0 ? '#ffb92e' : '#baf3ff');
    c.classList.add('pulse-dot');
    c.style.animationDelay = (i*0.3)+'s';
    dots.appendChild(c);
  });
</script>
</body>
</html>
